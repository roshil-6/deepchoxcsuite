# Render Blueprint — https://render.com/docs/blueprint-spec
# 1) Connect GitHub repo roshil-6/deepchoxcsuite, apply blueprint or create Web Service from repo.
# 2) Add Render Postgres; copy Internal DATABASE_URL into this service.
# 3) Set AI keys in the dashboard (never commit secrets).
#
# LLM: use GROQ_API_KEY and/or OPENAI_API_KEY + ANTHROPIC_API_KEY (dual staff sync). See .env.example.

services:
  - type: web
    name: deepchox-c-suite
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      # Optional:
      # - key: GROQ_MODEL
      #   value: llama-3.3-70b-versatile
      # - key: NEXT_PUBLIC_LANDING_HERO_VIDEO_URL
      #   sync: false

  - type: cron
    name: deepchox-dexo-daily-cron
    schedule: "0 12 * * *"
    command: >
      curl -sS -X POST
      -H "x-cron-secret: $CRON_SECRET"
      https://deepchox-c-suite.onrender.com/api/dexo/cron-daily
